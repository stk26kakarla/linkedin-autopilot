# =============================================================================
# Your content plan. Edit freely; no code changes needed.
# The automation picks one (topic -> subtopic) pair per run and writes a post.
# Runs Monday, Wednesday and Friday.
# =============================================================================

# How each run's pair is chosen:
#   rotate : step through the (topic, subtopic) pairs by date, cycling back to
#            the start when the list is exhausted (deterministic)
#   random : pick a random pair each run
selection_mode: rotate

# -----------------------------------------------------------------------------
# What every post is for. This shapes the angle, not just the wording. Applies to
# every topic below. Note it allows three kinds of post: correcting a myth is one
# option, not the required frame for all of them.
# -----------------------------------------------------------------------------
mission: >
  Educate, do not broadcast. Depending on what the research turns up, a post can
  correct a myth, report something genuinely new, or simply teach a better way to
  do a familiar job. Pick whichever the evidence actually supports: where social
  media hype or received wisdom is wrong, say so; where it is right, or where the
  honest answer is just "here is a useful thing that changed", say that instead.
  Two audiences at once: businesses deciding where to invest, and data and
  software engineers deciding how to do the work. Every post should leave the
  reader knowing something they can act on.

# -----------------------------------------------------------------------------
# Voice and formatting. This is fed to the model when it writes the post.
# Make it sound like you.
# -----------------------------------------------------------------------------
voice:
  author_context: >
    A hands-on software and data engineer who also runs a technology consultancy.
    Writes with practical authority, no hype, no buzzword soup. Prefers concrete
    detail and a clear point of view over generic observations.
  audience: >
    Two groups at once, and the post should work for both: data and software
    engineers who want a better way to do the work, and business, technical
    founder, and data / IT decision makers weighing where to spend. Assume the
    engineers know their craft and the decision makers do not want jargon.
  guidelines:
    - Open with a specific hook, not "In today's fast-paced world".
    - Lead with one clear insight tied to the researched news or trend.
    - Where the popular narrative is genuinely wrong, oversold, or oversimplified,
      say so plainly and explain what is actually true. Only when that is really
      the case; do not reach for a contrarian angle when the hyped thing is real
      or the honest post is just "this changed, here is why it matters".
    - Give the reader something they can act on, not just something interesting.
    - Treat the character limit as a limit, not a target. Cut supporting examples
      and caveats before cutting the main point.
    - Short paragraphs, 1 to 2 sentences each.
    - First person, plain English. Explain any jargon in a half-sentence.
    - End with a light, genuine question or takeaway, not a salesy CTA.
    - Never invent statistics; only use figures found during research.
  # LinkedIn's own cap is 3000. The commonly cited engagement sweet spot starts
  # around 1300 - the sources for that are marketing blogs rather than research,
  # but the dwell-time argument holds and 1500 leaves room to explain a mechanism
  # and still land an action.
  max_chars: 1500            # hard ceiling on the post, hashtags included
  use_emojis: true           # tasteful emojis allowed
  hashtag_count: 7           # number of hashtags to append

# -----------------------------------------------------------------------------
# Image direction (used to build the image prompt).
# -----------------------------------------------------------------------------
image:
  style: >
    Clean, modern, professional editorial illustration. Muted, confident colour
    palette. Conceptual rather than literal. No text, no logos, no watermarks,
    no charts with fake numbers. 1:1 square framing suitable for a LinkedIn feed.

# -----------------------------------------------------------------------------
# Your topics. Add / remove freely. Each topic has a list of subtopics.
# -----------------------------------------------------------------------------
topics:
  - name: Data Engineering
    subtopics:
      - Databricks and dbt in production
      - Orchestration with Airflow
      - Data quality and contracts
      - Lakehouse vs warehouse trade-offs

  - name: Automation and LLMs
    subtopics:
      - Whether AI speed gains actually translate into cost savings
      - Spotting automation candidates and judging feasibility against payoff
      - Hallucination and the limits of prompt engineering
      - Image and video generation in production workflows

  - name: Cloud and Platform
    subtopics:
      - Cost control on AWS
      - Infrastructure as code with Terraform
      - CI/CD for data teams
      - Microsoft Fabric and Power BI

  - name: IT and Security Advisory
    subtopics:
      - Microsoft 365 hardening for SMBs
      - Endpoint and identity security
      - Practical zero-trust for small teams
      - Backup and recovery basics
